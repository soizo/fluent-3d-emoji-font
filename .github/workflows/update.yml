name: Update fonts
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      publish_unverified_artwork:
        description: 'Publish tested fonts with explicit unverified artwork-rights notices'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fonts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      publishable: ${{ steps.build.outputs.publishable }}
      release_ready: ${{ steps.publication.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: artwork-cache
        with:
          path: work/emojipedia-assets/images.json
          key: emojipedia-${{ runner.os }}-${{ github.run_id }}
          restore-keys: emojipedia-${{ runner.os }}-
      - name: Discover Emojipedia, check rights, build and validate
        id: build
        env:
          MANUAL_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_unverified_artwork }}
        run: |
          if [ "$MANUAL_PUBLICATION" = true ]; then
            fluent-font --allow-unverified-local --output dist
          else
            fluent-font --output dist
          fi
      - name: Determine publication readiness without changing rights status
        id: publication
        env:
          RIGHTS_VERIFIED: ${{ steps.build.outputs.publishable }}
          MANUAL_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_unverified_artwork }}
        run: |
          ready=false
          if [ "$RIGHTS_VERIFIED" = true ] || [ "$MANUAL_PUBLICATION" = true ]; then
            test -s dist/Fluent3D-sbix.ttf
            test -s dist/Fluent3D-svg.ttf
            test -s dist/Fluent3D-sbix.woff2
            test -s dist/Fluent3D-svg.woff2
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.artwork-cache.outputs.cache-matched-key != format('emojipedia-{0}-{1}', runner.os, steps.build.outputs.cache_key)
        with:
          path: work/emojipedia-assets/images.json
          key: emojipedia-${{ runner.os }}-${{ steps.build.outputs.cache_key }}
      - name: Summary
        run: |
          if [ -f dist/RELEASE.md ]; then
            cat dist/RELEASE.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat dist/STATUS.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-report-or-verified-fonts
          path: dist/
          if-no-files-found: error
          retention-days: 14
  macos:
    needs: build
    if: needs.build.outputs.release_ready == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-report-or-verified-fonts
          path: dist
      - name: Native CoreText smoke test
        run: swift scripts/check_macos.swift dist/Fluent3D-sbix.ttf preview.png
      - name: Chromium pixel rendering regression
        run: |
          npm install --prefix work/browser-check --no-save playwright@1.62.1
          work/browser-check/node_modules/.bin/playwright install chromium
          mkdir -p "$HOME/Library/Fonts"
          cp dist/Fluent3D-sbix.ttf "$HOME/Library/Fonts/Fluent3D-sbix.ttf"
          NODE_PATH="$PWD/work/browser-check/node_modules" node scripts/check_browser.cjs dist/Fluent3D-sbix.ttf chromium-preview.png --local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-preview
          path: |
            preview.png
            chromium-preview.png
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release_ready == 'true'
    needs: [build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-report-or-verified-fonts
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-preview
          path: previews
      - name: Publish only new content
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ github.sha }}
          MANUAL_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_unverified_artwork }}
        shell: bash
        run: |
          set -euo pipefail
          # Differentiate a missing tag (404) from authentication/network failure.
          exists=false
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > release.json 2> error.txt; then
            exists=true
            if [ "$(jq -r .draft release.json)" = false ]; then
              echo "Identical content already published: $TAG"
              exit 0
            fi
          elif ! grep -q 'HTTP 404' error.txt; then
            cat error.txt >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          tar -czf Fluent3D-fonts.tar.gz -C dist .
          cp dist/RELEASE.md release-notes.md
          if [ "$MANUAL_PUBLICATION" = true ]; then
            printf '\n## Explicit manual publication\n\nThis release was built and tested entirely by GitHub Actions, then published at the maintainer’s explicit request. Artwork redistribution and font-embedding rights remain unverified. Original local-build metadata and restricted-embedding notices are retained; publication is not rights-holder permission. The project MIT licence covers code only.\n' >> release-notes.md
          fi
          if [ "$exists" = false ]; then
            gh release create "$TAG" --draft --target "$COMMIT" \
              --title "Fluent 3D Community $TAG (Emojipedia source)" --notes-file release-notes.md
          fi
          assets=(dist/*.ttf dist/*.woff2 dist/manifest.json dist/SHA256SUMS dist/RELEASE.md
                  dist/CODE-LICENSE.txt dist/LICENSING.md Fluent3D-fonts.tar.gz previews/*.png)
          if [ -f dist/NOT-FOR-REDISTRIBUTION.txt ]; then
            assets+=(dist/NOT-FOR-REDISTRIBUTION.txt)
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          sha256sum "${assets[@]}" | sed 's@  .*/@  @' > RELEASE-SHA256SUMS.txt
          gh release upload "$TAG" RELEASE-SHA256SUMS.txt --clobber
          gh release edit "$TAG" --notes-file release-notes.md --draft=false --latest
