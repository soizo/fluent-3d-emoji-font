name: Update fonts
on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:
    inputs:
      refresh_upstream:
        description: 'Contact Emojipedia for fresh artwork (otherwise reuse the saved source cache)'
        type: boolean
        default: false
      source_cache_release:
        description: 'Draft release containing the saved original source snapshot'
        type: string
        default: build-source-cache-2026-10-17
      publish_unverified_artwork:
        description: 'Publish tested fonts with explicit unverified artwork-rights notices'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fonts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # Read the maintainer-only draft source-cache release.
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      publishable: ${{ steps.build.outputs.publishable }}
      release_ready: ${{ steps.publication.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: artwork-cache
        if: github.event_name == 'schedule' || inputs.refresh_upstream
        with:
          path: work/emojipedia-assets/images.json
          key: emojipedia-${{ runner.os }}-${{ github.run_id }}
          restore-keys: emojipedia-${{ runner.os }}-
      - name: Discover Emojipedia, check rights, build and validate
        id: build
        env:
          MANUAL_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_unverified_artwork }}
          REFRESH_UPSTREAM: ${{ github.event_name == 'schedule' || inputs.refresh_upstream }}
          SOURCE_CACHE_RELEASE: ${{ inputs.source_cache_release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          options=()
          if [ "$MANUAL_PUBLICATION" = true ]; then
            options+=(--allow-unverified-local)
          fi
          if [ "$REFRESH_UPSTREAM" != true ]; then
            mkdir -p work/saved-source
            gh release download "$SOURCE_CACHE_RELEASE" --pattern SourceSnapshot.tar.gz --pattern SourceSnapshot.sha256 --dir work/saved-source
            (cd work/saved-source && sha256sum -c SourceSnapshot.sha256)
            tar -xzf work/saved-source/SourceSnapshot.tar.gz -C work/saved-source
            options+=(--source-manifest work/saved-source/snapshot/manifest.json
                      --cache work/saved-source/originals)
          fi
          fluent-font --output dist "${options[@]}"
          if [ "$REFRESH_UPSTREAM" != true ]; then
            cp work/saved-source/originals/*.png work/emojipedia-assets/
          fi
      - name: Determine publication readiness without changing rights status
        id: publication
        env:
          RIGHTS_VERIFIED: ${{ steps.build.outputs.publishable }}
          MANUAL_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_unverified_artwork }}
        run: |
          ready=false
          if [ "$RIGHTS_VERIFIED" = true ] || [ "$MANUAL_PUBLICATION" = true ]; then
            test -s dist/Fluent3D-sbix.ttf
            test -s dist/Fluent3D-svg.ttf
            test -s dist/Fluent3D-sbix.woff2
            test -s dist/Fluent3D-svg.woff2
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.event_name == 'schedule' || inputs.refresh_upstream) && steps.artwork-cache.outputs.cache-matched-key != format('emojipedia-{0}-{1}', runner.os, steps.build.outputs.cache_key)
        with:
          path: work/emojipedia-assets/images.json
          key: emojipedia-${{ runner.os }}-${{ steps.build.outputs.cache_key }}
      - name: Summary
        run: |
          if [ -f dist/RELEASE.md ]; then
            cat dist/RELEASE.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat dist/STATUS.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.publication.outputs.ready == 'true'
        with:
          name: source-snapshot
          path: |
            dist/manifest.json
            dist/emoji-test.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.publication.outputs.ready == 'true'
        with:
          name: original-artwork
          path: work/emojipedia-assets/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-report-or-verified-fonts
          path: dist/
          if-no-files-found: error
          retention-days: 14
  macos:
    needs: build
    if: needs.build.outputs.release_ready == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-report-or-verified-fonts
          path: dist
      - name: Native CoreText smoke test
        run: swift scripts/check_macos.swift dist/Fluent3D-sbix.ttf preview.png
      - name: Chromium pixel rendering regression
        run: |
          npm install --prefix work/browser-check --no-save playwright@1.62.1
          work/browser-check/node_modules/.bin/playwright install chromium
          mkdir -p "$HOME/Library/Fonts"
          cp dist/Fluent3D-sbix.ttf "$HOME/Library/Fonts/Fluent3D-sbix.ttf"
          for attempt in 1 2 3 4 5; do
            if NODE_PATH="$PWD/work/browser-check/node_modules" node scripts/check_browser.cjs dist/Fluent3D-sbix.ttf chromium-preview.png --local; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview
          path: |
            preview.png
            chromium-preview.png
  crop-440:
    needs: build
    if: needs.build.outputs.release_ready == 'true'
    uses: ./.github/workflows/crop-440.yml
    with:
      allow_unverified: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_unverified_artwork }}
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release_ready == 'true'
    needs: [build, macos, crop-440]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-report-or-verified-fonts
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-preview
          path: previews
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fonts-440
          path: dist-440
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-preview-440
          path: previews-440
      - name: Publish only new content
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ github.sha }}
          MANUAL_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_unverified_artwork }}
        shell: bash
        run: |
          set -euo pipefail
          # Differentiate a missing tag (404) from authentication/network failure.
          exists=false
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > release.json 2> error.txt; then
            exists=true
            if [ "$(jq -r .draft release.json)" = false ]; then
              echo "Identical content already published: $TAG"
              exit 0
            fi
          elif ! grep -q 'HTTP 404' error.txt; then
            cat error.txt >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          (cd dist-440 && sha256sum -c SHA256SUMS)
          jq -e --arg parent "$(jq -r .content_id dist/manifest.json)" '.parent_content_id == $parent' dist-440/manifest.json
          tar -czf Fluent3D-fonts.tar.gz -C dist .
          tar -czf Fluent3D-fonts-440.tar.gz -C dist-440 .
          cp dist-440/manifest.json manifest-440.json
          cp dist-440/SHA256SUMS SHA256SUMS-440
          cp dist-440/RELEASE.md RELEASE-440.md
          cp dist/RELEASE.md release-notes.md
          printf '\n## Additional 440×440 variant\n\nThe same source snapshot is also centre-cropped to 440×440 (36 pixels removed on every side), with no resampling. Download the four fonts ending in `-440` or `Fluent3D-fonts-440.tar.gz`. Install as **Fluent 3D Community 440** (or **Fluent 3D Community 440 SVG**) alongside the default 473px family. Both variants pass shaping, native CoreText and Chromium colour rendering checks. See `manifest-440.json` for the shared source provenance and separate crop hashes.\n' >> release-notes.md
          if [ "$MANUAL_PUBLICATION" = true ]; then
            printf '\n## Explicit manual publication\n\nThis release was built and tested entirely by GitHub Actions, then published at the maintainer’s explicit request. Artwork redistribution and font-embedding rights remain unverified. Original local-build metadata and restricted-embedding notices are retained; publication is not rights-holder permission. The project MIT licence covers code only.\n' >> release-notes.md
          fi
          if [ "$exists" = false ]; then
            gh release create "$TAG" --draft --target "$COMMIT" \
              --title "Fluent 3D Community $TAG (Emojipedia source)" --notes-file release-notes.md
          fi
          assets=(dist/*.ttf dist/*.woff2 dist/manifest.json dist/SHA256SUMS dist/RELEASE.md
                  dist/CODE-LICENSE.txt dist/LICENSING.md Fluent3D-fonts.tar.gz previews/*.png
                  dist-440/*.ttf dist-440/*.woff2 manifest-440.json SHA256SUMS-440 RELEASE-440.md
                  Fluent3D-fonts-440.tar.gz previews-440/*.png)
          if [ -f dist/NOT-FOR-REDISTRIBUTION.txt ]; then
            assets+=(dist/NOT-FOR-REDISTRIBUTION.txt)
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          sha256sum "${assets[@]}" | sed 's@  .*/@  @' > RELEASE-SHA256SUMS.txt
          gh release upload "$TAG" RELEASE-SHA256SUMS.txt --clobber
          gh release edit "$TAG" --notes-file release-notes.md --draft=false --latest
