name: Update fonts
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fonts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Fetch current official artwork
        run: git clone --depth 1 https://github.com/microsoft/fluentui-emoji.git work/upstream
      - name: Discover, build and validate
        id: build
        run: fluent-font --upstream work/upstream --output dist
      - name: Summary
        run: cat dist/RELEASE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-fonts
          path: dist/
          if-no-files-found: error
          retention-days: 14
  macos:
    needs: build
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-fonts
          path: dist
      - name: Native CoreText smoke test
        run: swift scripts/check_macos.swift dist/Fluent3D-sbix.ttf preview.png
      - name: Chromium pixel rendering regression
        run: |
          npm install --prefix work/browser-check --no-save playwright@1.62.1
          work/browser-check/node_modules/.bin/playwright install chromium
          NODE_PATH="$PWD/work/browser-check/node_modules" node scripts/check_browser.cjs dist/Fluent3D-sbix.ttf chromium-preview.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview
          path: |
            preview.png
            chromium-preview.png
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-fonts
          path: dist
      - name: Publish only new content
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Differentiate a missing tag (404) from authentication/network failure.
          exists=false
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > release.json 2> error.txt; then
            exists=true
            if [ "$(jq -r .draft release.json)" = false ]; then
              echo "Identical content already published: $TAG"
              exit 0
            fi
          elif ! grep -q 'HTTP 404' error.txt; then
            cat error.txt >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          tar -czf Fluent3D-fonts.tar.gz -C dist .
          if [ "$exists" = false ]; then
            gh release create "$TAG" --draft --target "$COMMIT" \
              --title "Fluent 3D Community $TAG (licensed subset)" --notes-file dist/RELEASE.md
          fi
          gh release upload "$TAG" dist/*.ttf dist/*.woff2 dist/manifest.json \
            dist/SHA256SUMS dist/RELEASE.md Fluent3D-fonts.tar.gz --clobber
          gh release edit "$TAG" --draft=false --latest
