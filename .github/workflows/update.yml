name: Update fonts
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fonts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      publishable: ${{ steps.build.outputs.publishable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: artwork-cache
        with:
          path: work/emojipedia-assets/images.json
          key: emojipedia-${{ runner.os }}-${{ github.run_id }}
          restore-keys: emojipedia-${{ runner.os }}-
      - name: Discover Emojipedia, check rights, build and validate
        id: build
        run: fluent-font --output dist
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.artwork-cache.outputs.cache-matched-key != format('emojipedia-{0}-{1}', runner.os, steps.build.outputs.cache_key)
        with:
          path: work/emojipedia-assets/images.json
          key: emojipedia-${{ runner.os }}-${{ steps.build.outputs.cache_key }}
      - name: Summary
        run: |
          if [ -f dist/RELEASE.md ]; then
            cat dist/RELEASE.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat dist/STATUS.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-report-or-verified-fonts
          path: dist/
          if-no-files-found: error
          retention-days: 14
  macos:
    needs: build
    if: needs.build.outputs.publishable == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-report-or-verified-fonts
          path: dist
      - name: Native CoreText smoke test
        run: swift scripts/check_macos.swift dist/Fluent3D-sbix.ttf preview.png
      - name: Chromium pixel rendering regression
        run: |
          npm install --prefix work/browser-check --no-save playwright@1.62.1
          work/browser-check/node_modules/.bin/playwright install chromium
          mkdir -p "$HOME/Library/Fonts"
          cp dist/Fluent3D-sbix.ttf "$HOME/Library/Fonts/Fluent3D-sbix.ttf"
          NODE_PATH="$PWD/work/browser-check/node_modules" node scripts/check_browser.cjs dist/Fluent3D-sbix.ttf chromium-preview.png --local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-preview
          path: |
            preview.png
            chromium-preview.png
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publishable == 'true'
    needs: [build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-report-or-verified-fonts
          path: dist
      - name: Publish only new content
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Differentiate a missing tag (404) from authentication/network failure.
          exists=false
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > release.json 2> error.txt; then
            exists=true
            if [ "$(jq -r .draft release.json)" = false ]; then
              echo "Identical content already published: $TAG"
              exit 0
            fi
          elif ! grep -q 'HTTP 404' error.txt; then
            cat error.txt >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          tar -czf Fluent3D-fonts.tar.gz -C dist .
          if [ "$exists" = false ]; then
            gh release create "$TAG" --draft --target "$COMMIT" \
              --title "Fluent 3D Community $TAG (Emojipedia source)" --notes-file dist/RELEASE.md
          fi
          gh release upload "$TAG" dist/*.ttf dist/*.woff2 dist/manifest.json \
            dist/SHA256SUMS dist/RELEASE.md Fluent3D-fonts.tar.gz --clobber
          gh release edit "$TAG" --draft=false --latest
