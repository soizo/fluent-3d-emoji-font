name: Build 440px companion fonts
on:
  workflow_call:
    inputs:
      allow_unverified:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-snapshot
          path: snapshot
      - name: Build 440px fonts from the primary release source snapshot
        env:
          ALLOW_UNVERIFIED: ${{ inputs.allow_unverified }}
        shell: bash
        run: |
          options=()
          if [ "$ALLOW_UNVERIFIED" = true ]; then
            options+=(--allow-unverified-local)
          fi
          fluent-font --source-manifest snapshot/manifest.json --crop-size 440 --output dist-440 "${options[@]}"
          test -s dist-440/Fluent3D-sbix-440.ttf
          test -s dist-440/Fluent3D-svg-440.woff2
          cat dist-440/RELEASE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fonts-440
          path: dist-440/
          if-no-files-found: error
          retention-days: 14
  render:
    needs: build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fonts-440
          path: dist-440
      - name: Native CoreText rendering
        run: swift scripts/check_macos.swift dist-440/Fluent3D-sbix-440.ttf preview-440.png
      - name: Chromium colour rendering
        env:
          FLUENT_FONT_POSTSCRIPT: Fluent3DCommunity04-440-Regular
        run: |
          npm install --prefix work/browser-check --no-save playwright@1.62.1
          work/browser-check/node_modules/.bin/playwright install chromium
          mkdir -p "$HOME/Library/Fonts"
          cp dist-440/Fluent3D-sbix-440.ttf "$HOME/Library/Fonts/Fluent3D-sbix-440.ttf"
          for attempt in 1 2 3 4 5; do
            if NODE_PATH="$PWD/work/browser-check/node_modules" node scripts/check_browser.cjs dist-440/Fluent3D-sbix-440.ttf chromium-preview-440.png --local; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-preview-440
          path: |
            preview-440.png
            chromium-preview-440.png
