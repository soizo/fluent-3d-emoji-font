version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    schedule:
      interval: monthly
