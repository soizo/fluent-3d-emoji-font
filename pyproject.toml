[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluent-3d-emoji-font"
version = "0.1.0"
description = "Auditable Fluent 3D emoji font builds with provenance and licensing gates"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fonttools[woff]==4.60.1", "Pillow==12.3.0", "requests==2.32.5", "uharfbuzz==0.51.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
fluent-font = "fluent_font.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
