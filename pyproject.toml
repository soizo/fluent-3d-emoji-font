[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluent-3d-emoji-font"
version = "0.4.0"
description = "Auditable Fluent 3D emoji font builds with provenance and licensing gates"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fonttools[woff]==4.66.1", "Pillow==12.3.0", "requests==2.34.2", "uharfbuzz==0.56.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
fluent-font = "fluent_font.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
